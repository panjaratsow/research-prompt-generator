<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Research Prompt Studio</title>
  <meta name="description" content="A privacy-first workspace for structured medical research prompts.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-lockup">
      <img
        class="brand-emblem"
        src="./assets/faculty-medicine-swu-emblem.png"
        alt="ตราคณะแพทยศาสตร์ มหาวิทยาลัยศรีนครินทรวิโรฒ / Faculty of Medicine, Srinakharinwirot University"
        width="103"
        height="44"
      >
      <div class="brand-copy">
        <h1>Research Prompt Studio</h1>
        <p class="brand-subtitle">คณะแพทยศาสตร์ มหาวิทยาลัยศรีนครินทรวิโรฒ</p>
      </div>
    </div>
    <div class="header-actions">
      <span class="privacy-status" data-i18n="privacyFirst">Privacy-first</span>
      <label class="language-control"><span data-i18n="interfaceLanguage">Language</span><select id="interfaceLanguage" data-testid="interface-language"><option value="th">ไทย</option><option value="en">English</option></select></label>
      <button type="button" id="resetButton" class="icon-button" aria-label="Start a new workspace" title="Start a new workspace"><img src="vendor/icons/rotate-ccw.svg" alt=""></button>
    </div>
  </header>
  <main class="workspace-shell">
    <section id="setupBar" data-testid="setup-bar" aria-label="Workspace setup"></section>
    <nav id="lifecycleRail" data-testid="lifecycle-rail" aria-label="Research lifecycle"></nav>
    <section id="workspaceMain" data-testid="adaptive-form" aria-label="Adaptive research form"></section>
    <aside id="standardsSummary" data-testid="standards-summary" aria-label="Standards summary"></aside>
  </main>
  <div id="promptDrawerRoot"></div>
  <div id="dialogRoot"></div>
  <div id="appStatus" class="sr-only" aria-live="polite"></div>
  <script src="vendor/mammoth.browser.min.js" defer></script>
  <script type="module" src="app.js"></script>
</body>
</html>
